name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      - run: pnpm format:check

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-typst
      - run: pnpm --filter @vdd/site check
      # Also builds the CV (cv/build.sh).
      - run: pnpm --filter @vdd/site build
      # Validates the built HTML (site/.htmlvalidate.json lists the rules turned off, with reasons in the PR that added it).
      - run: pnpm --filter @vdd/site validate
      # Internal links and #fragments in the built pages (external links: links.yml, weekly).
      - run: node tests/links/check-internal.mjs
      # Unit tests for copy and helpers (Node's built-in runner, no dependencies).
      - run: node --test "tests/unit/*.test.mjs"
      - name: check the CV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          cv/check.sh

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @vdd/worker typecheck
      - run: pnpm --filter @vdd/worker test
      - name: contact Lambda
        run: |
          pnpm --filter @vdd/contact typecheck
          pnpm --filter @vdd/contact test
          pnpm --filter @vdd/contact build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-typst
      - run: pnpm --filter @vdd/e2e exec playwright install --with-deps chromium
      # Builds the site, serves site/dist, then runs layout, a11y and menu checks.
      - run: pnpm --filter @vdd/e2e test
      - name: upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-and-report
          path: |
            tests/e2e/screenshots
            tests/e2e/playwright-report
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-typst
      - run: pnpm --filter @vdd/site build
      # Mobile profile, three runs per page: scores below the thresholds fail the build.
      - run: pnpm --filter @vdd/e2e lighthouse
      - name: upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: tests/e2e/lighthouse-report
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v
