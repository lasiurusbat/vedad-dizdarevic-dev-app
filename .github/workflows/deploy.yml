name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time. A newer push replaces a queued run; a running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: the deploy role trusts the OIDC subject for refs/heads/main only,
    # and a job with an environment gets a different subject.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-typst

      - name: Build site
        run: pnpm --filter @vdd/site build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Before the Worker, so the new route never calls the placeholder or an older contract.
      - name: Deploy contact Lambda
        run: |
          pnpm --filter @vdd/contact build
          (cd lambda/contact/dist && zip -q contact.zip index.mjs)
          aws lambda update-function-code --function-name vdd-contact \
            --zip-file fileb://lambda/contact/dist/contact.zip --output text --query LastUpdateStatus
          aws lambda wait function-updated --function-name vdd-contact

      # Hashed assets first and never deleted: cached HTML from the previous deploy still
      # points at the old ones.
      - name: Upload hashed assets
        run: aws s3 sync site/dist/_astro "s3://${{ vars.SITE_BUCKET }}/_astro" --only-show-errors

      - name: Upload everything else
        run: aws s3 sync site/dist "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_astro/*" --only-show-errors

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: node --test "tests/smoke/*.test.mjs"
