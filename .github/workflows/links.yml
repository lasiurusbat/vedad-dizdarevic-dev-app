name: External links

# Weekly, never on a PR or a push: an outside site being down must not block a deploy.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-typst
      - run: pnpm --filter @vdd/site build
      - name: check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --root-dir ${{ github.workspace }}/site/dist 'site/dist/**/*.html'
          fail: false
          output: lychee-report.md
      - name: open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub limits an issue body to 65536 characters.
          head -c 60000 lychee-report.md > lychee-body.md
          gh issue create --title "Broken external links ($(date -u +%F))" --body-file lychee-body.md
