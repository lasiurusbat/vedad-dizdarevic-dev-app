profile:
  en: 'Cloud/DevOps engineer coming from a decade of technical production work in 3D/CGI pipelines. Designed, built and deployed Sorted (live at sorted.onl), a multi-tenant SaaS on AWS ECS Fargate, with all infrastructure in Terraform and tag-driven releases through GitHub Actions and OIDC. Holds a DevOps Engineer diploma from DataScientest and further hands-on project experience with Kubernetes (EKS, ArgoCD/GitOps) and GitLab CI/CD. Currently preparing for the AWS Certified Solutions Architect – Associate exam. Brings strong troubleshooting discipline, pipeline thinking and a decade of Agile (Scrum/Kanban) production workflows.'
  de: 'Cloud-/DevOps-Engineer nach einem Jahrzehnt technischer Produktionsarbeit in 3D-/CGI-Pipelines. Konzeption, Entwicklung und Deployment von Sorted (live unter sorted.onl), einer mandantenfähigen SaaS-Anwendung auf AWS ECS Fargate, mit der gesamten Infrastruktur in Terraform und Tag-basierten Releases über GitHub Actions und OIDC. DevOps-Engineer-Diplom von DataScientest (heute Liora) sowie praktische Projekterfahrung mit Kubernetes (EKS, ArgoCD/GitOps) und GitLab CI/CD. Bereitet sich derzeit auf die Prüfung zum AWS Certified Solutions Architect – Associate vor. Bringt ausgeprägte Problemlösungskompetenz, Pipeline-Denken und ein Jahrzehnt Erfahrung in agilen (Scrum/Kanban) Produktionsabläufen mit.'

