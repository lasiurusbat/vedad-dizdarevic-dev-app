projects:
  - title:
      {
        en: Sorted — Multi-Tenant SaaS on AWS (ECS Fargate),
        de: Sorted — Mandantenfähige SaaS auf AWS (ECS Fargate),
      }
    link: { text: sorted.onl, url: 'https://sorted.onl' }
    bullets:
      en:
        - 'Built the infrastructure in Terraform as one module with separate dev and prod environments and S3 remote state: VPC with private subnets, ALB, ECS Fargate, RDS PostgreSQL, ECR, Secrets Manager and CloudWatch Logs.'
        - 'Designed prod for availability: Multi-AZ RDS and a NAT gateway per AZ are Terraform flags, with deletion protection and rolling deployments that start the new task before the old one stops.'
        - 'Built a release pipeline: pushing a git tag runs GitHub Actions (typecheck, lint, unit tests), builds both Docker images with OCI labels and version/commit build args, and pushes immutable-tag images to ECR through OIDC with no stored AWS keys. Deploying means setting the image tag and applying Terraform (manual deploy job).'
        - 'Added infrastructure CI: terraform fmt, validate, shellcheck and Terraform tests on every PR.'
        - 'Set up email on AWS: SES inbound (receipt rule, KMS-encrypted S3, SNS webhooks) and outbound (configuration set, delivery events), with an ECS task role instead of API keys.'
        - 'Containerized the app (multi-stage Dockerfile, nginx + Bun task, Docker Compose locally, migrations on start).'
        - 'Application: React, Express, TypeScript, Prisma/PostgreSQL with row-level-security multi-tenancy, Stripe billing, pg-boss jobs, Sentry, guarded OpenAI features; 2,400+ Playwright e2e tests and 3,600+ unit tests.'
      de:
        - 'Aufbau der Infrastruktur in Terraform als ein Modul mit getrennten Dev- und Prod-Umgebungen und S3-Remote-State: VPC mit privaten Subnetzen, ALB, ECS Fargate, RDS PostgreSQL, ECR, Secrets Manager und CloudWatch Logs.'
        - 'Prod auf Verfügbarkeit ausgelegt: Multi-AZ-RDS und ein NAT-Gateway pro AZ sind Terraform-Flags, dazu Löschschutz und Rolling Deployments, bei denen der neue Task startet, bevor der alte stoppt.'
        - 'Aufbau einer Release-Pipeline: Ein Git-Tag startet GitHub Actions (Typecheck, Lint, Unit-Tests), baut beide Docker-Images mit OCI-Labels sowie Versions-/Commit-Build-Args und pusht Images mit unveränderlichen Tags per OIDC nach ECR, ohne gespeicherte AWS-Schlüssel. Deployment heißt: Image-Tag setzen und Terraform anwenden (manueller Deploy-Job).'
        - 'Infrastruktur-CI: terraform fmt, validate, shellcheck und Terraform-Tests bei jedem PR.'
        - 'E-Mail auf AWS: SES eingehend (Receipt Rule, KMS-verschlüsselter S3-Bucket, SNS-Webhooks) und ausgehend (Configuration Set, Zustellereignisse), mit ECS-Task-Rolle statt API-Schlüsseln.'
        - 'Containerisierung der Anwendung (Multi-Stage-Dockerfile, nginx + Bun-Task, Docker Compose lokal, Migrationen beim Start).'
        - 'Anwendung: React, Express, TypeScript, Prisma/PostgreSQL mit Row-Level-Security-Mandantentrennung, Stripe-Billing, pg-boss-Jobs, Sentry, abgesicherte OpenAI-Funktionen; über 2.400 Playwright-E2E-Tests und über 3.600 Unit-Tests.'
  - title:
      {
        en: Rain Alert — Tag-Driven Releases on Free Tiers,
        de: Rain Alert — Tag-basierte Releases auf kostenlosen Tarifen,
      }
    link: { text: rainalert.live, url: 'https://rainalert.live/' }
    bullets:
      en:
        - 'Built a release pipeline: pushing a git tag builds one Docker image, tests it inside the container, ships that same image to Render through Docker Hub and confirms the new version on the live site, with no manual steps after the tag.'
        - 'Hardened delivery so that pull requests, including those from forks and Dependabot, can never push an image or deploy; a server-side cache and a budgeted fallback API cover the rate limits of the free weather APIs.'
      de:
        - 'Aufbau einer Release-Pipeline: Ein Git-Tag baut ein Docker-Image, testet es im Container, liefert genau dieses Image über Docker Hub an Render aus und prüft die neue Version auf der Live-Website, ohne manuelle Schritte nach dem Tag.'
        - 'Absicherung der Auslieferung: Pull Requests, auch von Forks und Dependabot, können nie ein Image pushen oder deployen; ein serverseitiger Cache und eine Fallback-API mit Budget fangen die Rate-Limits der kostenlosen Wetter-APIs ab.'
  - title:
      {
        en: WhoCalledBack — Raspberry Pi First, AWS Serverless Next (in progress),
        de: WhoCalledBack — Erst Raspberry Pi, dann AWS Serverless (in Arbeit),
      }
    link: { text: whocalledback.com, url: 'https://whocalledback.com' }
    bullets:
      en:
        - 'Designed one codebase for a Raspberry Pi 5 and AWS Lambda (both arm64), with four ports swapped per environment (ElasticMQ/SQS, cron/EventBridge Scheduler, AES-GCM/KMS, none/SES). Phase 1 runs on the Pi for €0; the AWS phase is designed, not built.'
        - 'A push to the staging branch builds arm64 images into GHCR with no stored credentials and runs them in hardened Docker Compose behind Tailscale; tenant isolation is enforced by Postgres row-level security, with roles created only in migrations.'
      de:
        - 'Eine Codebasis für einen Raspberry Pi 5 und AWS Lambda (beide arm64), mit vier pro Umgebung getauschten Ports (ElasticMQ/SQS, Cron/EventBridge Scheduler, AES-GCM/KMS, keine/SES). Phase 1 läuft für 0 € auf dem Pi; die AWS-Phase ist entworfen, nicht gebaut.'
        - 'Ein Push auf den Staging-Branch baut arm64-Images in die GHCR, ohne gespeicherte Zugangsdaten, und startet sie in gehärtetem Docker Compose hinter Tailscale; Postgres Row-Level Security erzwingt die Mandantentrennung, Rollen entstehen nur in Migrationen.'
  - title:
      {
        en: This Portfolio — Static Site as a Small Production Platform,
        de: Dieses Portfolio — Statische Website als kleine Produktionsplattform,
      }
    link: { text: vedad-dizdarevic.dev, url: 'https://vedad-dizdarevic.dev' }
    bullets:
      en:
        - 'Runs a private S3 bucket behind a Cloudflare Worker, with AWS and Cloudflare in Terraform and three OIDC roles, each trusted for one repository, instead of stored keys in CI.'
        - 'Sets six security headers on every response and checks them on the live domain after each deploy; this CV is built from YAML with Typst in the same pipeline.'
      de:
        - 'Betrieb eines privaten S3-Buckets hinter einem Cloudflare Worker, mit AWS und Cloudflare in Terraform und drei OIDC-Rollen, jede für ein Repository, statt gespeicherter Schlüssel in der CI.'
        - 'Sechs Security-Header auf jeder Antwort, nach jedem Deploy auf der Live-Domain geprüft; dieser Lebenslauf entsteht in derselben Pipeline mit Typst aus YAML.'
  - title:
      {
        en: Ads-Platform — Full-Stack AWS Deployment,
        de: Ads-Platform — Vollständiges AWS-Deployment,
      }
    link:
      {
        text: github.com/lasiurusbat/Ads-Platform,
        url: 'https://github.com/lasiurusbat/Ads-Platform',
      }
    bullets:
      en:
        - 'Containerized a FastAPI/PostgreSQL application with Docker Compose, including networking and healthchecks.'
        - 'Deployed a three-tier AWS architecture (ALB → ECS Fargate → RDS) with Terraform: VPC, security groups, IAM execution/task roles.'
        - 'Built a GitLab CI/CD pipeline for build, test and deployment; configured Grafana alerting for RDS connections and tuned it to cut false positives.'
      de:
        - 'Containerisierung einer FastAPI-/PostgreSQL-Anwendung mit Docker Compose, inklusive Netzwerk und Healthchecks.'
        - 'Dreistufige AWS-Architektur (ALB → ECS Fargate → RDS) mit Terraform: VPC, Security Groups, IAM-Ausführungs-/Task-Rollen.'
        - 'GitLab-CI/CD-Pipeline für Build, Test und Deployment; Grafana-Alerting für RDS-Verbindungen, angepasst zur Reduzierung von Fehlalarmen.'
  - title:
      {
        en: SRE-Project — Kubernetes GitOps Platform (EKS),
        de: SRE-Project — Kubernetes-GitOps-Plattform (EKS),
      }
    link:
      {
        text: github.com/lasiurusbat/sre-project,
        url: 'https://github.com/lasiurusbat/sre-project',
      }
    bullets:
      en:
        - 'Ran a multi-service platform on AWS EKS with ArgoCD for GitOps delivery (Ghost with MySQL), plus Prometheus, Grafana, Splunk and Fluent Bit for observability.'
        - 'Fixed an EBS CSI driver IRSA misconfiguration (OIDC provider ID mismatch, stale trust policies) and ArgoCD sync failures (wrong target branches, Bitnami registry migration).'
      de:
        - 'Betrieb einer Multi-Service-Plattform auf AWS EKS mit ArgoCD für GitOps-Delivery (Ghost mit MySQL) sowie Prometheus, Grafana, Splunk und Fluent Bit für Observability.'
        - 'Behebung einer fehlerhaften EBS-CSI-Driver-IRSA-Konfiguration (falsche OIDC-Provider-ID, veraltete Trust Policies) und von ArgoCD-Sync-Fehlern (falsche Ziel-Branches, Bitnami-Registry-Migration).'
  - title:
      { en: Additional Infrastructure & CI/CD Work, de: Weitere Infrastruktur- & CI/CD-Arbeiten }
    link: { text: gitlab.com/lasiurusbat/cars-api, url: 'https://gitlab.com/lasiurusbat/cars-api' }
    bullets:
      en:
        - 'Multi-region Terraform project (SNS, S3 backend with native state locking, reusable modules, provider aliasing).'
        - 'GitLab pipelines for a Spring Boot app on Elastic Beanstalk (with IAM policies) and a Gatsby site (build, test, deploy, smoke-test).'
      de:
        - 'Multi-Region-Terraform-Projekt (SNS, S3-Backend mit nativem State-Locking, wiederverwendbare Module, Provider-Aliasing).'
        - 'GitLab-Pipelines für eine Spring-Boot-Anwendung auf Elastic Beanstalk (inkl. IAM-Policies) und eine Gatsby-Website (Build, Test, Deploy, Smoke-Test).'

